name: euphoniaaireviewer_admin
description: Manage your Euphonia-AI-Reviewer projects.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.1.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  flutter_card_swiper: ^7.0.0
  firebase_ui_shared: ^1.4.1
  firebase_core: any
  firebase_auth: any
  firebase_ui_auth: any
  fftea: any
  image: any
  wav: any
  audioplayers: any
  cloud_firestore: any
  firebase_storage: any
  cached_network_image: any
  cloud_functions: any
  shared_preferences: any
  provider: any
  file_picker: any
  csv: any
  just_audio: any
  archive: any
  percent_indicator: any
  path_provider: any
  dio: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/AppIcon.jpg
